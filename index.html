<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Weather app</title>
</head>
<body>

  <header class="header">
    <div class="header__top">
      <div class="logo">
        <img src="assets/images/logo.svg" alt="" class="logo__img">        
        <span class="logo__info">Weather Now</span>
      </div>
      
      <div class="units">
        <button type="button" class="units__button" aria-expanded="false" aria-controls="units-menu">
          <img src="assets/images/icon-units.svg" alt="" class="units__icon-unit">
          <span class="units__span">Units</span>
          <img src="assets/images/icon-dropdown.svg" alt="" class="units__icon-dropdown">
        </button>

        <div id="units-menu" class="units__menu" hidden>
          <button type="button" class="units__toggle">Switch to Imperial</button>
          <fieldset class="units__fieldset">
            <legend class="units__title">Temperature</legend>
            <label>
              <input type="radio" name="temperature" value="celsius" checked>Celsius (°C)
            </label>

            <label>
              <input type="radio" name="temperature" value="fahrenheit">Fahrenheit (°F)
            </label>
          </fieldset>

          <fieldset class="units__fieldset">
            <legend class="units__title">Wind Speed</legend>
            <label>
              <input type="radio" name="wind" value="km/h" checked>km/h
            </label>

            <label>
              <input type="radio" name="wind" value="mph">mph
            </label>
          </fieldset>

          <fieldset class="units__fieldset">
            <legend class="units__title">Precipitation</legend>
              <label>
                <input type="radio" name="precipitation" value="mm" checked>Millimeters (mm)
              </label>

              <label>
                <input type="radio" name="precipitation" value="in">Inches (in)
              </label>
          </fieldset>
        </div>
      </div>
    </div>

    <h1 class="header__title">How's the sky looking today?</h1>

    <form action="" class="form">
      <label for="city" class="visually-hidden">Search for a city</label>
      <input type="text" id="city" name="city" placeholder="Search for a city, e.g., New York">
      <button type="submit" class="button">Search</button>
    </form>
  </header>

  <main class="weather-app-main">
    <section>
      <div>
        Feels like
        <!-- Insert temperature here -->

        Humidity
        <!-- Insert humidity here -->

        Wind
        <!-- Insert wind here -->
        
        Precipitation
        <!-- Insert precipitation here -->
      </div>
    </section>

    <section>
      Daily forecast
      <!-- Insert daily forecast for the next 7 days here -->
    </section>

    <aside>
      Hourly forecast
      <!-- Insert hourly forecast for the selected day here -->
    </aside>
  </main>
</body>
</html>
